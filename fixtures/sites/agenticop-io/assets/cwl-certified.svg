<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="cwlCertTitle cwlCertDesc">
  <title id="cwlCertTitle">CWL Certified Genome</title>
  <desc id="cwlCertDesc">Certification mark: Chrysalis Web Language genome verified via emit:site.</desc>
  <defs>
    <path id="cwlArcTop" d="M 28,80 A 52,52 0 0 1 132,80" fill="none"/>
    <path id="cwlArcBot" d="M 132,80 A 52,52 0 0 1 28,80" fill="none"/>
    <linearGradient id="cwlStrandA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ec8d8"/>
      <stop offset="100%" stop-color="#2a9fb0"/>
    </linearGradient>
    <linearGradient id="cwlStrandB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a54b"/>
      <stop offset="100%" stop-color="#c4842e"/>
    </linearGradient>
  </defs>

  <!-- Outer / inner rings -->
  <circle cx="80" cy="80" r="76" fill="#0a0c14" stroke="#8b93a7" stroke-width="1.25"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#3d4558" stroke-width="0.75"/>
  <circle cx="80" cy="80" r="58" fill="none" stroke="#6b7388" stroke-width="1"/>

  <!-- Arc captions -->
  <text fill="#c5cad6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.4">
    <textPath href="#cwlArcTop" startOffset="50%" text-anchor="middle">CERTIFIED GENOME</textPath>
  </text>
  <text fill="#c5cad6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.6">
    <textPath href="#cwlArcBot" startOffset="50%" text-anchor="middle">EMIT · SITE</textPath>
  </text>

  <!-- Side ticks -->
  <line x1="24" y1="80" x2="34" y2="80" stroke="#8b93a7" stroke-width="1.5"/>
  <line x1="126" y1="80" x2="136" y2="80" stroke="#8b93a7" stroke-width="1.5"/>

  <!-- Compact DNA motif -->
  <g transform="translate(80 52)" fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M-10,-10 C-4,-4 -4,4 -10,10 C-16,16 -16,24 -10,30" stroke="url(#cwlStrandA)"/>
    <path d="M10,-10 C4,-4 4,4 10,10 C16,16 16,24 10,30" stroke="url(#cwlStrandB)"/>
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#9aa3b5" stroke-width="1.4"/>
    <line x1="-9" y1="8" x2="9" y2="8" stroke="#9aa3b5" stroke-width="1.4"/>
    <line x1="-8" y1="18" x2="8" y2="18" stroke="#9aa3b5" stroke-width="1.4"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="1.5">
    <tspan fill="#5ec8d8">C</tspan><tspan fill="#e8edf5">W</tspan><tspan fill="#e8a54b">L</tspan>
  </text>
  <text x="80" y="122" text-anchor="middle" fill="#8b93a7" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="6.5" font-weight="600" letter-spacing="1.8">TIP VERIFIED</text>
</svg>
