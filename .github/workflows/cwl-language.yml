name: CWL language

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build WebIR (pillar home)
        run: npm run build:webir
      - name: Language gates
        env:
          CWL_REQUIRE_WEBIR: "1"
        run: npm run test:language
      - name: Emit smoke (WebIR reverse)
        run: npm run smoke:cwl-emit
      - name: Publish prep (no publish)
        run: npm run test:cwl-publish-prep
      - name: CLI check golds
        run: npm run check -- fixtures/language-gold
